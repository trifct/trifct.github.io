site_name: Trifct 的妙妙屋
theme:
  name: material

  # -- 浏览器标签页图标 --
  favicon: assets/favicon.svg

  # -- Material 功能增强（平衡导航栏） --
  features:
    - navigation.tabs          # 顶部标签页导航，填满中间区域
    - navigation.top           # 回到顶部按钮
    - navigation.path          # 面包屑导航
    - navigation.indexes       # 自动生成索引页
    - navigation.footer        # 页面底部上/下页导航
    - toc.follow               # 目录跟随滚动
    - toc.integrate            # 目录与正文整合

    - search.highlight         # 搜索结果高亮

  icon:
    logo: simple/moleculer
    previous: fontawesome/solid/angle-left
    next: fontawesome/solid/angle-right
    repo: fontawesome/brands/github

  palette:

    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/link
        name: 切换为亮色模式

    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: cyan
      accent: deep orange
      toggle:
        icon: material/toggle-switch 
        name: 切换为暗色模式

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: deep orange
      toggle:
        icon: material/toggle-switch-off-outline
        name: 切换为系统默认
  
  language: zh

nav:
  - Home: index.md
  
  - Notes: 
    - notes/index.md
    - 结构化学: 
      - notes/结构化学/index.md
      - 结构化学 I:
        - notes/结构化学/结构化学 1/index.md
        - Chapter 1-2: notes/结构化学/结构化学 1/Chapter 1-2.md
        - Chapter 3: notes/结构化学/结构化学 1/Chapter 3.md
        - Chapter 4: notes/结构化学/结构化学 1/Chapter 4.md
        - Chapter 5: notes/结构化学/结构化学 1/Chapter 5.md
        - Chapter 6: notes/结构化学/结构化学 1/Chapter 6.md
        - Chapter 7: notes/结构化学/结构化学 1/Chapter 7.md
        - Chapter 8: notes/结构化学/结构化学 1/Chapter 8.md
        - Chapter 9: notes/结构化学/结构化学 1/Chapter 9.md
        - Chapter 10: notes/结构化学/结构化学 1/Chapter 10.md
        - Chapter 11: notes/结构化学/结构化学 1/Chapter 11.md
        - Chapter 12: notes/结构化学/结构化学 1/Chapter 12.md
        
      - 结构化学 II:
        - notes/结构化学/结构化学 2/index.md
    
    - 物理化学:
      - 物理化学 I :
        - notes/物理化学/物理化学 1/index.md
        - Chapter 1: notes/物理化学/物理化学 1/Chapter 1.md
      - 物理化学 II :
        - notes/物理化学/物理化学 2/index.md
        - Chapter 7: notes/物理化学/物理化学 2/Chapter 7.md
        - Chapter 8: notes/物理化学/物理化学 2/Chapter 8.md
    
    - 化学实验报告:
      - notes/化学实验/index.md
      - 化学测量学实验上:
        - notes/化学实验/化学测量学实验上/index.md
    
    - 常微分方程(1 学分):
      - notes/常微分方程(1 学分)/index.md
      - Chapter 1: notes/常微分方程(1 学分)/Chapter 1.md
      - Chapter 2: notes/常微分方程(1 学分)/Chapter 2.md

    - 化工原理及实验:
      - notes/化工原理及实验/index.md
      - Chapter 1: notes/化工原理及实验/Chapter 1.md

    - 其他:
      - notes/其他/index.md

  - Thoughts:
    - thoughts/index.md
    - 施工记录:
      - thoughts/history.md
  
  - Friends:
    - 友情链接:
      - friends/friends.md

plugins:
  - search
  - statistics:
      exclude_path: 'index.md'
  - document-dates:
      position: bottom            # 显示位置: top(标题后) bottom(文档末尾), 默认: top
      type: date               # 日期类型: date datetime timeago, 默认: date
      exclude:                 # 排除文件列表
        - index.md                  # 示例：排除指定文件
        - thoughts/*                   # 示例：排除 thoughts 目录下所有文件，包括子目录
        - friends/*
      date_format: '%Y-%m-%d'  # 日期格式化字符串（例如: %Y年%m月%d日、%b %d, %Y）
      time_format: '%H:%M:%S'  # 时间格式化字符串（仅在 type=datetime 时有效）
      show_created: true       # 显示创建日期: true false, 默认: true
      show_updated: true       # 显示最后更新日期: true false, 默认: true
      show_author: true        # 显示作者: true(头像) text(文本) false(隐藏), 默认: true

# -- 右上角 GitHub 仓库链接 --
repo_url: https://github.com/trifct/trifct.github.io
repo_name: Trifct 的秘密小仓库

copyright: "Copyright © 2026 Trifct"

extra_css:
  - stylesheets/extra.css

# -- 数学公式渲染（MathJax） --
markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js